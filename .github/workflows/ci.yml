name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

# CI mirrors scripts/validate.sh (lib/ci-parity.test.ts enforces that).
# Nothing should fail here that validate.sh would not have caught locally.
env:
  # tests/harness/global-setup.ts reads this; the service below matches
  # docker-compose.dev.yml so local and CI share one connection shape.
  TEST_PG_BASE_URL: postgresql://tensixtythree:tensixtythree@127.0.0.1:51063

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No `version:` — packageManager in package.json is the single
      # source of truth. Specifying both makes the action refuse to run,
      # which is what silently killed CI for two months.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
      - name: Type check
        run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tensixtythree
          POSTGRES_PASSWORD: tensixtythree
          POSTGRES_DB: tensixtythree
        ports:
          - 51063:5432
        options: >-
          --health-cmd "pg_isready -U tensixtythree"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@cascade.dev"
          git config --global user.name "Cascade CI"
      # Plain `pnpm test`: the old command piped vitest through tee and
      # took its exit code from `grep "Tests.*passed"`, which matches
      # "Tests 2 failed | 1690 passed" — so the job could not fail.
      - name: Run tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tensixtythree
          POSTGRES_PASSWORD: tensixtythree
          POSTGRES_DB: tensixtythree
        ports:
          - 51063:5432
        options: >-
          --health-cmd "pg_isready -U tensixtythree"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # SQLite was retired in Phase 51; the old `file:./test-e2e.db` here
      # meant the e2e job never ran against the real database engine.
      DATABASE_URL: postgresql://tensixtythree:tensixtythree@127.0.0.1:51063/tensixtythree
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
      - name: Push schema to the e2e database
        run: pnpm exec prisma db push
      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-fake-key-not-used-by-smoke-specs
